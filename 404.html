    <script>
      // Applied before React mounts so switching themes never flashes the
      // wrong palette for a frame (the alternative — doing this in a
      // useEffect — paints light mode first even when dark is stored).
      (function () {
        try {
          var stored = localStorage.getItem("front-desk-theme");
          var systemDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var dark = stored ? stored === "dark" : systemDark;
          if (stored === "system" || !stored) dark = systemDark;
          document.documentElement.classList.toggle("dark", dark);
        } catch (e) {}
      })();
    </script>
